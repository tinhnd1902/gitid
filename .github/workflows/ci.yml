name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    env:
      # never let a test see a real git configuration
      GIT_CONFIG_NOSYSTEM: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: gofmt
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Unit tests (race detector)
        run: go test -race -count=1 ./...

      - name: Integration tests (real git, temporary HOME, offline)
        run: go test -tags integration -count=1 ./...

      - name: No direct HOME access outside cmd/ and internal/env
        run: make check-home
