name: Release

# Runs only when a version tag is pushed, for example: git tag -a v0.1.0 -m "gitid v0.1.0"
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: GoReleaser
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release and upload assets
    env:
      # never let a test see a real git configuration
      GIT_CONFIG_NOSYSTEM: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # GoReleaser needs the full history and tags

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test (gate)
        run: go test -count=1 ./...

      - name: Warn when the Homebrew tap cannot be updated
        env:
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: |
          if [ -z "${HOMEBREW_TAP_GITHUB_TOKEN}" ]; then
            echo "::warning::HOMEBREW_TAP_GITHUB_TOKEN not set; Homebrew tap will not be updated"
          fi

      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
