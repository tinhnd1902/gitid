name: Bug report
description: Something does not work as documented
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this.

        **Before you paste anything**, remove tokens, passwords and private
        details (real names, emails, company hosts). gitid never needs your
        private SSH keys, so please do not attach them.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest sequence of commands or key presses that triggers it.
      placeholder: |
        1. gitid apply --dry-run
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: gitid version
      description: Output of `gitid version`.
    validations:
      required: true
  - type: input
    id: git-version
    attributes:
      label: git version
      description: Output of `git --version` (gitid needs 2.36 or newer).
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS (Apple silicon)
        - macOS (Intel)
        - Linux (amd64)
        - Linux (arm64)
        - Other
    validations:
      required: true
  - type: input
    id: terminal
    attributes:
      label: Terminal and shell
      description: For example "iTerm2, zsh" or "Terminal.app, bash". Helps with display problems in the TUI.
  - type: textarea
    id: doctor
    attributes:
      label: Output of `gitid doctor`
      description: Optional but very helpful. Redact anything private.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I removed secrets and personal data from everything I pasted.
          required: true
        - label: I searched the existing issues first.
          required: true
