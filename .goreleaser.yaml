# GoReleaser configuration (v2 syntax).
#
# Releases are cut by .github/workflows/release.yml when a `vX.Y.Z` tag is
# pushed (see "Releasing (maintainers)" in CONTRIBUTING.md). Try the whole
# pipeline locally without publishing anything:  make release-snapshot
version: 2

project_name: gitid

before:
  hooks:
    # not `go mod tidy`: it can dirty the working tree and make GoReleaser refuse to release
    - go mod download

builds:
  - id: gitid
    main: ./cmd/gitid
    binary: gitid
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      # `main.version` is what `gitid version` prints
      - -s -w -X main.version={{ .Version }}

archives:
  - id: gitid
    formats: [tar.gz]
    # install.sh builds the download URL from this exact pattern
    # (gitid_<version>_<os>_<arch>.tar.gz); change both together.
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - README_VI.md
      - CHANGELOG.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  github:
    owner: tinhnd1902
    name: gitid
  draft: false
  prerelease: auto

# ---------------------------------------------------------------------------
# Homebrew tap: github.com/tinhnd1902/homebrew-tap, file Casks/gitid.rb
#
# GoReleaser deprecated `brews` (formulae) in v2.10; prebuilt binaries are
# published as casks. Casks are macOS-only: Linux users use install.sh.
#
# The cask is pushed with the secret HOMEBREW_TAP_GITHUB_TOKEN (a fine-grained
# token with Contents read/write on the tap repository only). When that
# variable is empty or unset (forks, local snapshot runs), skip_upload is true:
# the GitHub release is still created and the cask is only written to dist/.
homebrew_casks:
  - name: gitid
    ids: [gitid]
    directory: Casks
    binaries: [gitid]
    homepage: https://github.com/tinhnd1902/gitid
    description: "Manage, switch, clone and check Git identities across hosting platforms"
    repository:
      owner: tinhnd1902
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    commit_author:
      name: gitid-release-bot
      email: noreply@github.com
    commit_msg_template: "gitid {{ .Tag }}"
    skip_upload: '{{ if index .Env "HOMEBREW_TAP_GITHUB_TOKEN" }}false{{ else }}true{{ end }}'
    # The binary is not code-signed or notarized yet, and Homebrew marks cask
    # downloads as quarantined, so Gatekeeper would block the first run. This
    # clears the flag for the gitid binary only (the archive is verified by the
    # sha256 in the cask). Proper fix later: signing and notarization.
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/gitid"]
          end
